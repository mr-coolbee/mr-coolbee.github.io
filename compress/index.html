<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="description" content="圖片影片等媒體的壓縮工具。">
    <meta name="theme-color" content="#fafafa">

    <title>壓縮工具 - Coolbee</title>
    <link rel="icon" type="image/svg+xml" href="/web-assets/common/icons/favicon.svg">
    <link rel="preload" href="/web-assets/common/fonts/google-sans-flex.woff2" as="font" type="font/woff2" crossorigin>
    <script src="/js/common/theme-init.js"></script>
    <link rel="stylesheet" href="/css/common/main.css">
    <link rel="stylesheet" href="/css/common/components/button.css">
    <link rel="stylesheet" href="/css/common/components/top-app-bar.css">
    <link rel="stylesheet" href="/css/common/components/form.css">
    <link rel="stylesheet" href="/css/compress/main.css">
    <script type="module" src="/js/compress/main.js"></script>
</head>
<body>
    <header class="top">
        <div class="top-bar">
            <div class="top-bar-inner">
                <a class="icon-btn" href="/" aria-label="回到首頁" title="回到首頁">
                    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
                </a>
                <div class="top-actions">
                    <button class="icon-btn" type="button" id="themeToggle" aria-label="切換淺色或深色主題" title="切換淺色或深色主題">
                        <svg class="icon theme-icon-light" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4 6 18M18 6l1.4-1.4"/></svg>
                        <svg class="icon theme-icon-dark" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5a8.5 8.5 0 1 0 10.7 10.7Z"/></svg>
                    </button>
                </div>
            </div>
        </div>
        <h1 class="top-title-large">壓縮工具</h1>
    </header>
    <main class="middle">
        <section class="section" aria-labelledby="t-add">
            <h2 class="section-title" id="t-add">選擇檔案</h2>
            <label class="drop" id="drop">
                <input type="file" id="fileInput" accept="image/*,video/*" multiple>
                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V4M7 9l5-5 5 5"/><path d="M4 15v4a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-4"/></svg>
                <span class="drop-title">拖曳、貼上...或點這裡選擇</span>
                <span class="drop-note">圖片 (JPEG、PNG、WebP、AVIF...)、影片 (MP4、MOV、WebM...)。所有檔案都在瀏覽器處理，不會上傳。</span>
            </label>
            <p class="banner" id="videoWarn" hidden>這個瀏覽器不支援 WebCodecs，無法壓縮影片。需要使用新版 Chrome、Firefox、Safari。</p>
        </section>

        <section class="section" aria-labelledby="t-set">
            <h2 class="section-title" id="t-set">設定</h2>
            <div class="settings">
                <div class="settings-group">
                    <h3>圖片</h3>
                    <label class="field">
                        <select id="imgFormat">
                            <option value="auto">維持原狀</option>
                            <option value="jpeg">JPEG (MozJPEG)</option>
                            <option value="webp">WebP</option>
                            <option value="avif">AVIF（最小，較慢）</option>
                            <option value="png">PNG（OxiPNG，無損）</option>
                        </select>
                        <span>輸出格式</span>
                    </label>
                    <label class="range">
                        <span class="range-head"><span>品質</span><output id="imgQualityOut">75</output></span>
                        <input type="range" id="imgQuality" min="1" max="100" value="75">
                    </label>
                    <div>
                        <label class="field"><input type="number" id="imgWidth" min="16" max="16384" inputmode="numeric" placeholder=" "><span>最大寬度 (px)</span></label>
                        <span class="field-hint">留空 = 不縮小。只能縮小。</span>
                    </div>
                </div>
                <div class="settings-group">
                    <h3>影片</h3>
                    <label class="field">
                        <select id="vidFormat"></select>
                        <span>輸出格式</span>
                    </label>
                    <label class="field">
                        <select id="vidRes">
                            <option value="0">維持原狀</option>
                            <option value="1080">1080p 以下</option>
                            <option value="720">720p 以下</option>
                            <option value="480">480p 以下</option>
                            <option value="360">360p 以下</option>
                        </select>
                        <span>解析度</span>
                    </label>
                    <label class="field">
                        <select id="vidQuality">
                            <option value="high">高</option>
                            <option value="medium" selected>中</option>
                            <option value="low">低</option>
                            <option value="very-low">很低</option>
                        </select>
                        <span>畫質</span>
                    </label>
                    <label class="switch"><input type="checkbox" role="switch" id="vidMute">移除聲音</label>
                </div>
            </div>
        </section>

        <section class="section" aria-labelledby="t-res" id="resultSection" hidden>
            <h2 class="section-title" id="t-res">結果</h2>
            <ul class="jobs" id="jobs"></ul>
            <div class="job-tools">
                <button class="btn btn-tonal" type="button" id="downloadAll">全部下載</button>
                <button class="btn btn-text" type="button" id="clearAll">清空</button>
            </div>
        </section>

        <section class="section" aria-labelledby="t-sources">
            <h2 class="section-title" id="t-sources">Sources</h2>
            <p class="sources">
                圖片使用 <a href="https://github.com/jamsinclair/jSquash" target="_blank" rel="noopener">jSquash</a>；<br>
                影片使用 <a href="https://mediabunny.dev" target="_blank" rel="noopener">Mediabunny</a>。
            </p>
        </section>
    </main>

    <dialog class="cmp" id="cmp" aria-labelledby="cmpTitle">
        <div class="cmp-head">
            <h2 id="cmpTitle"></h2>
            <button class="icon-btn" type="button" id="cmpClose" aria-label="關閉" title="關閉"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
        </div>
        <div class="cmp-stage" id="cmpStage"></div>
        <input class="cmp-range" type="range" id="cmpRange" min="0" max="100" value="50" aria-label="比較滑桿：左原檔，右壓縮">
        <p class="cmp-meta"><span id="cmpBefore"></span><span id="cmpAfter"></span></p>
    </dialog>

    <footer class="bottom">
        <p>Coolbee・2026・版權沒有・翻印不究</p>
    </footer>
</body>
</html>
